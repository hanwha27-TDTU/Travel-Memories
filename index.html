<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>여행 추억 · Travel Memories</title>
  <meta name="description" content="나의 여행 추억을 사진·지도·별점과 함께 기록하는 앱" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B3%3C/text%3E%3C/svg%3E" />

  <!-- Leaflet (map) from CDN -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">🧳 여행 추억</h1>
    <button id="btn-add" class="btn-primary" type="button">+ 새 기록</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="timeline" role="tab">🗓️ 타임라인</button>
    <button class="tab" data-view="map" role="tab">🗺️ 지도</button>
  </nav>

  <main class="content">
    <!-- Timeline view -->
    <section id="view-timeline" class="view active">
      <div class="toolbar">
        <input id="search" type="search" placeholder="🔍 제목·장소·메모·태그 검색" />
        <div id="tag-filter" class="tag-filter"></div>
      </div>
      <div id="timeline" class="timeline"></div>
      <div id="empty" class="empty hidden">
        <p>아직 기록이 없어요.</p>
        <p>오른쪽 위 <strong>+ 새 기록</strong>으로 첫 여행을 남겨보세요 ✈️</p>
      </div>
    </section>

    <!-- Map view -->
    <section id="view-map" class="view">
      <div id="map"></div>
    </section>
  </main>

  <!-- Add / Edit modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modal-title">새 여행 기록</h2>
        <button id="modal-close" class="icon-btn" type="button" aria-label="닫기">✕</button>
      </div>

      <form id="memory-form" class="form">
        <input type="hidden" id="f-id" />

        <label>제목
          <input id="f-title" type="text" placeholder="예: 제주도 여름 여행" required />
        </label>

        <div class="row">
          <label>날짜
            <input id="f-date" type="date" required />
          </label>
          <label>별점
            <div id="f-rating" class="rating" data-value="0">
              <span data-star="1">☆</span><span data-star="2">☆</span><span data-star="3">☆</span><span data-star="4">☆</span><span data-star="5">☆</span>
            </div>
          </label>
        </div>

        <label>장소
          <input id="f-place" type="text" placeholder="예: 성산일출봉" />
        </label>

        <div class="map-pick">
          <div class="map-pick-head">
            <span>📍 지도에서 위치 선택 (선택)</span>
            <button id="f-locate" type="button" class="btn-ghost">내 위치</button>
          </div>
          <div id="pick-map"></div>
          <small id="f-coords" class="coords">위치 미지정</small>
        </div>

        <label>메모
          <textarea id="f-memo" rows="4" placeholder="그날의 추억을 남겨보세요..."></textarea>
        </label>

        <label>태그 (쉼표로 구분)
          <input id="f-tags" type="text" placeholder="예: 맛집, 자연, 가족" />
        </label>

        <label>사진
          <input id="f-photos" type="file" accept="image/*" multiple />
        </label>
        <div id="photo-preview" class="photo-preview"></div>

        <div class="form-actions">
          <button id="f-delete" type="button" class="btn-danger hidden">삭제</button>
          <button type="submit" class="btn-primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Detail modal -->
  <div id="detail" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="detail-title"></h2>
        <button id="detail-close" class="icon-btn" type="button" aria-label="닫기">✕</button>
      </div>
      <div id="detail-body" class="detail-body"></div>
      <div class="form-actions">
        <button id="detail-edit" type="button" class="btn-primary">편집</button>
      </div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
