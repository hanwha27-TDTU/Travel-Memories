<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3f6f78" />
  <title>Bugeon Journey · 여행 추억</title>
  <meta name="description" content="사진·장소·비용과 짧은 감정을 연결해 여행의 기억을 되찾는 개인 여행기록 앱" />
  <!-- 정적 호스팅(GitHub Pages)에서 응답 헤더를 못 쓰므로 CSP를 meta로 부분 적용(DEPLOYMENT S-05).
       스택 계약(scripts/check-csp.mjs 게이트가 검사):
       - wss://*.supabase.co  : Supabase Realtime 웹소켓 (https만으로는 wss 불허)
       - worker-src blob:     : MapLibre GL이 blob: URL 워커를 생성 (없으면 지도 전체 불능)
       - img-src *.supabase.co: Storage 서명 URL 썸네일 직접 표시
       - 지도 제공자(A-006) 확정 시 style/tiles/glyphs/sprite 호스트를 connect-src·img-src에
         추가하고 check-csp.mjs의 계약도 같은 커밋에서 갱신할 것. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob: https://*.supabase.co https://tile.openstreetmap.org; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://tile.openstreetmap.org https://nominatim.openstreetmap.org; worker-src 'self' blob:; child-src blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%B3%3C/text%3E%3C/svg%3E" />
  <!-- base 의존 링크는 하드코딩 금지 — Vite가 %BASE_URL%을 치환(check-base-consistency 게이트) -->
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
