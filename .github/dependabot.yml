version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    # 보안 업데이트만 받는다. 일반 버전 PR은 릴리스 후보가 아닌데 Ready로 열려
    # 전체 harness/live를 자동 실행하므로 원자 릴리스 규칙과 충돌한다.
    # GitHub 공식 계약상 0은 version update만 끄고 security update는 유지한다.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Seoul
    open-pull-requests-limit: 0
