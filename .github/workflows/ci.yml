name: CI

# ── CI 실행 정책 (헌법 §15가 정본 · 사용자 결정 2026-08-03) ─────────────────────
#
# 이 파일은 **일정**을 정하고, 각 초록이 **무슨 뜻인지**는 헌법 §15가 정한다.
# `check-ci-policy`가 둘의 드리프트를 RED로 잡는다.
#
#  ① 작업 중(Draft PR) → **빠른 차선만**(`fast-gates`). 전체가 아니므로 **병합 근거가 아니다.**
#  ② Ready 전환(=머지·배포할 릴리스 후보) → **build 뒤** 전체 Required 1회
#     (`harness` + `live-render`). 문서·기능을 모으는 동안에는 Ready로 바꾸지 않는다.
#  ③ 새 커밋 → 낡은 실행 자동 취소(아래 concurrency). 옛 커밋의 결과는 의미가 없다.
#  ④ 병합 후 main → **이 워크플로와 harness는 다시 돌지 않는다.** deploy-pages는
#     배포 산출물 생성·시크릿 검사·배포만 한다. 하네스→머지→배포를 한 릴리스 묶음으로 본다.
#  ⑤ 실패 후 코드가 바뀌면 → `synchronize`가 새 커밋으로 다시 돈다(③의 따름정리).
#
# 🔴 왜 `push`가 아니라 `pull_request`인가: **draft 여부는 PR의 성질이라 push 이벤트가 모른다.**
#    ①을 구현하려면 PR 이벤트여야 한다. 개인 저장소(fork 없음)라 이벤트를 하나만 쓰면
#    같은 커밋이 두 번 도는 옛 중복도 그대로 없다.
# 🔴 대가(정직하게): PR이 없는 브랜치 push는 아무것도 재지 않는다. 이 저장소의 모든 작업은
#    PR을 거치고, 커밋 전 로컬 전체 하네스가 규율이므로 받아들인다.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# ③ 같은 PR에 연속 push 시 이전 실행 취소(최신 커밋만 의미 있음).
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ① 작업 중에도 도는 좁은 검사 — **초록이 「통과」를 뜻하지 않는다.**
  #
  # 🔴 이름에 그 사실을 박아 둔다: `npm run gates`의 판정문 자체가
  # *"재본 N개 통과 · M개는 아예 안 쟀습니다"*라고 말하고 안 잰 이름을 나열한다(§2-K).
  # 그 규율을 CI로 옮긴 것이 이 job이다 — 여기 초록만 보고 병합하면 §2-G(SKIP≠PASS) 위반.
  fast-gates:
    name: fast-gates (빠른 차선 — 병합 근거 아님)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Fast gates (typecheck + 정적)
        run: npm run gates

  harness:
    # ② Draft에서는 돌지 않는다. Ready 전환(ready_for_review)과 그 뒤의 새 커밋에서만.
    #
    # 🔴 이 저장소의 `main`에는 **브랜치 보호가 없다**(실측 2026-08-03 `protected:false`).
    # 그래서 "Required가 pending이라 병합이 막힌다"는 기계적 보장이 **없다** — draft인 채로도
    # 병합이 가능하다. 그 자리를 막는 것은 헌법 §15의 병합 규칙과 사람/AI의 확인뿐이다.
    # 보호 규칙을 켜게 되면 skipped를 성공으로 세지 않도록 Required 이름을 함께 점검할 것.
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 판은 `.nvmrc` 한 곳이 정한다(SSOT). 워크플로에 숫자를 박으면 로컬과 어긋나고,
          # 그 어긋남이 2026-07-26에 게이트를 CI에서만 죽여 배포를 두 번 막았다.
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
      # 사용자 결정 2026-08-04: 릴리스 후보 앱을 먼저 재빌드하고 그 산출물 기준으로 하네스.
      - name: Harness (Required gates)
        run: npm run harness

  # 라이브 렌더 — **이 앱에서 유일하게 도는 런타임 검출층**(CLAUDE.md §10).
  #
  # 왜 별도 job인가: 이 검사는 브라우저 바이너리를 받아야 하므로 harness job보다 느리고,
  # 설치 실패는 앱의 결함이 아니다. 섞어 두면 "브라우저를 못 받아서 빨간불"이 반복되며
  # 사람이 빨간불을 무시하기 시작한다 — 그 순간 게이트는 죽는다(gates 헌장 §2-B ③).
  #
  # 왜 CI에 있어야 하는가: 2026-07-27 건강진단 전까지 이 검사는 harness에도 CI에도 없어서
  # **전역 playwright를 가진 사람이 기억해서 손으로** 돌려야만 돌았다. 조항(1층)은 "완료의
  # 정의"에 적혀 있었지만 구조(2층)가 없었고, 직전 세션의 M-0037이 정확히 이 검사에서 났다.
  # 여기서 도는 순간 "다음 사람이 이 규칙을 몰라도 지켜지는가?"의 답이 예가 된다(§7).
  #
  # 🔴 배포(deploy-pages)에는 걸지 않는다 — 그리고 ④ 이후 **전체 검사는 main에서 안 돈다.**
  # 정직하게 적어 둔다: harness·라이브 모두 PR 머리에서 잰 것을 신뢰한다. base가 움직여
  # squash 트리가 PR 머리와 달라지는 좁은 창의 회귀는 배포 후 실기기가 첫 검출자다.
  # (배포 경로에 브라우저 설치를 끼우면 배포 지연·실패 표면이 넓어져 그쪽이 더 비싸다.)
  live-render:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # 브라우저는 lock에 없다(바이너리라서). 판은 devDependency의 playwright가 정한다.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # 반드시 build가 먼저다 — `verify-editor-live`는 `dist`를 잰다. 그리고 **낡은 dist를
      # 재면 검사가 공허해지므로**(M-0037) 스크립트가 스스로 신선도를 확인하고 멈춘다.
      - name: Build
        run: npm run build
      - name: Live render gates
        run: npm run live
