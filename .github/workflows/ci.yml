name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Harness (Required gates)
        run: npm run harness
      - name: Build
        run: npm run build
